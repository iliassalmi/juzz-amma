const audio = new Audio();
audio.preload = "auto";
audio.setAttribute("playsinline", "");
const urlsFor = (rec, s, a) => { const f = pad(s, 3) + pad(a, 3) + ".mp3"; return ["https://everyayah.com/data/" + rec.id + "/" + f].concat(rec.alt ? [rec.alt + f] : []); };

const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("juzamma", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("audio");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("audio", mode); const q = fn(t.objectStore("audio")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return { get: k => tx("readonly", s => s.get(k)), put: (k, v) => tx("readwrite", s => s.put(v, k)), clear: () => tx("readwrite", s => s.clear()) };
})();

const mem = new Map();      // clé -> Promise<url|null>
const corsBad = new Set();  // hôtes sans CORS
async function fetchAudio(rec, s, a) {
  for (const url of urlsFor(rec, s, a)) {
    const host = new URL(url).host;
    if (corsBad.has(host)) continue;
    try {
      const r = await fetch(url, { mode: "cors" });
      if (r.ok) { let b = await r.blob(); if (b.size > 800) { if (!b.type) b = new Blob([b], { type: "audio/mpeg" }); return b; } }
    } catch (e) { if (navigator.onLine !== false) corsBad.add(host); }
  }
  return null;
}
function getURL(rec, s, a) {
  const k = rec.id + "/" + s + ":" + a;
  if (!mem.has(k)) {
    mem.set(k, (async () => {
      let b = null;
      try { b = await idb.get(k); } catch (e) {}
      if (!b) b = await fetchAudio(rec, s, a);
      return b ? URL.createObjectURL(b) : null;
    })().then(u => { if (!u) mem.delete(k); return u; }));
  }
  return mem.get(k);
}

const silMem = {};
function silenceURL(sec) {
  const k = Math.max(0.5, Math.min(120, Math.round(sec * 2) / 2));
  if (silMem[k]) return silMem[k];
  const sr = 8000, n = Math.round(sr * k), buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) dv.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); dv.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, "data"); dv.setUint32(40, n * 2, true);
  return (silMem[k] = URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
}

let unlocked = false;
function unlock() {
  if (unlocked) return Promise.resolve();
  try {
    audio.src = silenceURL(0.5);
    const p = audio.play();
    return (p || Promise.resolve()).then(() => { unlocked = true; }).catch(() => {});
  } catch (e) { return Promise.resolve(); }
}

/* ---------------- moteur de session ---------------- */
const PL = { on: false, mode: "", s: 0, from: 0, to: 0, steps: [], si: 0, rep: 0, vi: 0, phase: "", tok: 0, repDur: 0, pre: false, res: null, err: 0, cur: 0 };

function buildSteps(mode, from, to, reps, cfg = S.settings) {
  const steps = [];
  if (mode === "listen") { steps.push({ k: "listen", vs: range(from, to), reps, gap: false, label: from === to ? "Verset " + from : "Versets " + from + " → " + to }); return steps; }
  const rNew = Math.max(1, cfg.rNew);
  for (let i = from; i <= to; i++) {
    steps.push({ k: "new", vs: [i], reps: rNew, gap: true, label: "Nouveau verset " + i });
    if (i > from && cfg.rChain > 0) {
      const a = cfg.win ? Math.max(from, i - cfg.win + 1) : from;
      const isFull = a === from && i === to;
      if (isFull && cfg.rAll > 0) continue; // couvert par « tout ensemble »
      if (a < i) steps.push({ k: "chain", vs: range(a, i), reps: cfg.rChain, gap: true, label: "Enchaînement " + a + " → " + i });
    }
  }
  if (to > from && cfg.rAll > 0) steps.push({ k: "all", vs: range(from, to), reps: cfg.rAll, gap: true, label: "Tout ensemble " + from + " → " + to });
  return steps;
}

function playSrc(src, tok) {
  return new Promise(res => {
    let fin = false;
    const done = v => { if (fin) return; fin = true; audio.onended = audio.onerror = null; PL.res = null; res(v); };
    PL.res = done;
    audio.onended = () => done(isFinite(audio.duration) ? audio.duration : 0);
    audio.onerror = () => done(-1);
    audio.defaultPlaybackRate = S.settings.speed;
    audio.src = src;
    audio.playbackRate = S.settings.speed;
    const p = audio.play();
    if (p) p.catch(e => { if (tok !== PL.tok) return; if (e && e.name === "NotAllowedError") { renderPlayer(); } else if (e && e.name !== "AbortError") done(-1); });
  });
}
audio.addEventListener("loadedmetadata", () => { audio.playbackRate = S.settings.speed; });

async function playVerse(s, a, tok) {
  const rec = curRec();
  let local = null;
  try { local = await Promise.race([getURL(rec, s, a), new Promise(r => setTimeout(() => r(null), 6000))]); } catch (e) {}
  if (tok !== PL.tok) return -2;
  const cands = local ? [local] : urlsFor(rec, s, a);
  for (const c of cands) {
    const d = await playSrc(c, tok);
    if (tok !== PL.tok) return -2;
    if (d >= 0) return d;
  }
  return -1;
}

function prefetch() {
  const rec = curRec(), out = [];
  let si = PL.si, vi = PL.vi + 1;
  while (out.length < 4 && si < PL.steps.length) {
    const stp = PL.steps[si];
    if (vi < stp.vs.length) { const v = stp.vs[vi]; if (!out.includes(v)) out.push(v); vi++; }
    else { si++; vi = 0; }
  }
  out.forEach(v => getURL(rec, PL.s, v));
}

async function startSession(mode, s, from, to) {
  stopSession(true);
  const u = unlock();
  Object.assign(PL, { on: true, mode, s, from, to, si: 0, rep: 0, vi: 0, repDur: 0, err: 0, cur: 0,
    steps: buildSteps(mode, from, to, mode === "listen" ? (S.settings.loop === 0 ? Infinity : S.settings.loop) : 1),
    pre: mode === "listen" && from === 1 && S.settings.bism && s !== 9 });
  PL.tok++;
  S.last = { s, from, to, mode, t: Date.now() }; save();
  setMedia();
  wake(true);
  renderPlayer(); highlight();
  const tok = PL.tok;
  await u;
  if (tok === PL.tok) run();
}

async function run() {
  const tok = PL.tok;
  if (!PL.on) return;
  if (PL.pre) {
    PL.phase = "bism"; PL.cur = 0; renderPlayer(); highlight();
    await playVerse(1, 1, tok);
    if (tok !== PL.tok) return;
    PL.pre = false;
  }
  const stp = PL.steps[PL.si];
  if (!stp) return finish();
  const v = stp.vs[PL.vi];
  PL.phase = "listen"; PL.cur = v; renderPlayer(); highlight(v, stp.vs); setMedia();
  prefetch();
  const d = await playVerse(PL.s, v, tok);
  if (tok !== PL.tok) return;
  if (d < 0) {
    PL.err++;
    if (PL.err >= 2 || !navigator.onLine) { stopSession(); toast("Audio indisponible — vérifie ta connexion ou change de récitateur dans Réglages."); return; }
  } else { PL.err = 0; PL.repDur += d; }
  PL.vi++;
  if (PL.vi < stp.vs.length) return run();
  if (stp.gap && S.settings.gap > 0 && PL.repDur > 0) {
    PL.phase = "gap"; renderPlayer(); highlight(null, stp.vs);
    await playSrc(silenceURL(PL.repDur * S.settings.gap * S.settings.speed), tok);
    if (tok !== PL.tok) return;
  }
  PL.repDur = 0; PL.vi = 0; PL.rep++;
  if (PL.rep < stp.reps) return run();
  PL.rep = 0; PL.si++;
  if (PL.si < PL.steps.length) return run();
  finish();
}

function stopSession(silent) {
  PL.tok++;
  const was = PL.on;
  PL.on = false; PL.phase = "";
  try { audio.pause(); } catch (e) {}
  if (PL.res) PL.res(-2);
  wake(false);
  if (!silent || was) { renderPlayer(); highlight(); }
}
function skip(d) {
  if (!PL.on) return;
  const stp = PL.steps[PL.si];
  PL.tok++; if (PL.res) PL.res(-2); PL.pre = false;
  if (stp && stp.k === "listen") {
    PL.vi = Math.max(0, Math.min(stp.vs.length - 1, PL.vi + d));
  } else {
    PL.si = Math.max(0, Math.min(PL.steps.length - 1, PL.si + d)); PL.vi = 0;
  }
  PL.rep = 0; PL.repDur = 0;
  run();
}
function togglePause(force) {
  if (!PL.on) return;
  const pause = force !== undefined ? force : !audio.paused;
  if (pause) audio.pause(); else { const p = audio.play(); p && p.catch(() => {}); }
}
audio.addEventListener("play", () => renderPlayer());
audio.addEventListener("pause", () => renderPlayer());
audio.addEventListener("timeupdate", () => {
  if (PL.phase !== "gap") return;
  const b = document.querySelector("#player .bar.g i");
  if (b && audio.duration) b.style.width = Math.min(100, audio.currentTime / audio.duration * 100) + "%";
});

function finish() {
  const { mode, s, from, to } = PL;
  stopSession();
  const whole = from === 1 && to === BY[s].v.length;
  if (whole) S.rev[s] = Date.now();
  if (mode === "learn") {
    for (let a = from; a <= to; a++) if (st(s, a) === 0) setSt(s, a, 1);
    save(); render();
    openSheet(`<h2 style="font-size:22px">Session terminée</h2>
      <p class="mut">${esc(BY[s].tr)}, versets ${from} → ${to}. Tu les connais par cœur ?</p>
      <div style="display:grid;gap:10px;margin-top:14px">
        <button class="btn pri full" data-act="markRange" data-s="${s}" data-f="${from}" data-t="${to}" data-v="2">✅ Oui, mémorisés</button>
        <button class="btn full" data-act="markRange" data-s="${s}" data-f="${from}" data-t="${to}" data-v="1">🔁 Pas encore, je garde « en cours »</button>
        <button class="btn full" data-act="again" data-s="${s}" data-f="${from}" data-t="${to}">↻ Recommencer la session</button>
      </div>`);
  } else {
    save(); render();
    toast(whole ? "Écoute terminée — sourate notée comme révisée" : "Écoute terminée");
  }
}

let wl = null;
async function wake(on) {
  try {
    if (on && S.settings.wake && "wakeLock" in navigator) { if (!wl) wl = await navigator.wakeLock.request("screen"); wl.addEventListener && wl.addEventListener("release", () => { wl = null; }); }
    else if (!on && wl) { await wl.release(); wl = null; }
  } catch (e) { wl = null; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && PL.on) wake(true); });

function setMedia() {
  if (!("mediaSession" in navigator) || !PL.on) return;
  try {
    const sr = BY[PL.s];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: sr.tr + (PL.cur ? " — verset " + PL.cur : ""), artist: curRec().name, album: "Juz ʿAmma",
      artwork: [{ src: "icon-512.png", sizes: "512x512", type: "image/png" }]
    });
  } catch (e) {}
}
try {
  const ms = navigator.mediaSession;
  ms.setActionHandler("play", () => togglePause(false));
  ms.setActionHandler("pause", () => togglePause(true));
  ms.setActionHandler("nexttrack", () => skip(1));
  ms.setActionHandler("previoustrack", () => skip(-1));
} catch (e) {}

let tick = 0;
setInterval(() => {
  if (PL.on && !audio.paused) { const k = dkey(); S.log[k] = (S.log[k] || 0) + 1; if (++tick % 15 === 0) save(); }
}, 1000);

let view = { name: "home" };
function go(name, p = {}, push = true) {
  view = Object.assign({ name }, p);
  if (push) try { history.pushState(view, ""); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
window.addEventListener("popstate", e => { view = (e.state && e.state.name) ? e.state : { name: "home" }; render(); });

function render() {
  const app = $("#app");
  if (view.name === "home") app.innerHTML = vHome();
  else if (view.name === "list") app.innerHTML = vList();
  else if (view.name === "surah") app.innerHTML = vSurah();
  else if (view.name === "settings") app.innerHTML = vSettings();
  const tab = view.name === "surah" ? "list" : view.name;
  $("#tabs").innerHTML = [["home", "Accueil", IC.home], ["list", "Sourates", IC.list], ["settings", "Réglages", IC.set]]
    .map(([k, l, i]) => `<button class="${tab === k ? "on" : ""}" data-act="tab" data-v="${k}">${i}<span>${l}</span></button>`).join("");
  document.documentElement.style.setProperty("--fs", S.settings.fs + "px");
  highlight(PL.on ? PL.cur : null, PL.on && PL.steps[PL.si] ? PL.steps[PL.si].vs : null, true);
}

function ring(m, l) {
  const r = 46, c = 2 * Math.PI * r, pm = m / TOTAL, pl = l / TOTAL;
  return `<svg width="112" height="112" viewBox="0 0 112 112" style="flex:none">
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/>
    ${m + l ? `<circle cx="56" cy="56" r="${r}" fill="none" stroke="#F0B44A" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(pm + pl) * c} ${c}" transform="rotate(-90 56 56)" opacity=".85"/>` : ""}
    ${m ? `<circle cx="56" cy="56" r="${r}" fill="none" stroke="#E9D3A3" stroke-width="10" stroke-linecap="round" stroke-dasharray="${pm * c} ${c}" transform="rotate(-90 56 56)"/>` : ""}
    <text x="56" y="62" text-anchor="middle" fill="#fff" font-size="22" font-family="Fraunces,Georgia,serif" font-weight="600">${m && pm < .01 ? "<1" : Math.round(pm * 100)}%</text></svg>`;
}

function vHome() {
  const g = gCounts(), today = Math.round((S.log[dkey()] || 0) / 60);
  let h = `<section class="hero"><div class="hello">As-salāmu ʿalaykum</div><h1>Juz ʿAmma</h1>
    <div class="ring">${ring(g.m, g.l)}<div><div class="big">${g.m}<span style="font-size:16px;opacity:.7"> / ${TOTAL}</span></div>
    <div style="opacity:.8;font-size:14px">versets mémorisés</div><div style="opacity:.8;font-size:14px;margin-top:4px"><span style="color:#F0B44A">●</span> ${g.l} en cours</div></div></div></section>
    <div class="stats"><div class="stat"><b>${g.done}<small style="font-size:13px" class="mut">/${DATA.length}</small></b><span>sourates sues</span></div>
    <div class="stat"><b>${streak()}</b><span>jours d'affilée</span></div><div class="stat"><b>${today}</b><span>min ce jour</span></div></div>`;
  // reprendre
  if (S.last && BY[S.last.s]) {
    const L = S.last, sr = BY[L.s], c = counts(L.s);
    const allDone = range(L.from, L.to).every(a => st(L.s, a) === 2);
    const nx = allDone ? nextChunk(L.s) : { from: L.from, to: L.to };
    h += `<div class="card"><h3>▶︎ Reprendre</h3>
      <div class="row"><div class="sp"><div style="font-weight:600">${esc(sr.tr)} <span class="mut sm">· ${esc(sr.fr)}</span></div>
      <div class="sm mut">${allDone ? "Bloc suivant" : "Dernière session"} : versets ${nx.from} → ${nx.to} · ${c.m}/${c.n} mémorisés</div></div>
      <div class="ar" style="font-size:26px;line-height:1.3">${sr.ar}</div></div>
      <div class="row" style="margin-top:12px"><button class="btn pri sp" data-act="learnNow" data-s="${L.s}" data-f="${nx.from}" data-t="${nx.to}">🧠 Apprendre</button>
      <button class="btn" data-act="open" data-s="${L.s}" data-f="${nx.from}" data-t="${nx.to}">Ouvrir</button></div></div>`;
  }
  // prochaine sourate
  const nextS = order().find(n => { const c = counts(n); return c.m < c.n; });
  if (nextS && (!S.last || nextS !== S.last.s)) {
    const sr = BY[nextS], c = counts(nextS);
    h += `<div class="card"><h3>✦ Prochaine sourate</h3><div class="row" data-act="open" data-s="${nextS}">
      <div class="num ${c.m ? "part" : ""}">${nextS}</div><div class="sp"><div style="font-weight:600">${esc(sr.tr)}</div><div class="sm mut">${esc(sr.fr)} · ${c.m}/${c.n} versets</div></div>
      <div class="ar" style="font-size:24px;line-height:1.3">${sr.ar}</div></div></div>`;
  } else if (!nextS) {
    h += `<div class="card" style="text-align:center"><h3 style="justify-content:center">Mā shāʾ Allāh 🤍</h3><p class="mut sm">Tout Juz ʿAmma est marqué comme mémorisé. Place à la révision régulière.</p></div>`;
  }
  // à réviser
  const mems = DATA.map(s => s.n).filter(n => { const c = counts(n); return c.m === c.n; })
    .sort((a, b) => (S.rev[a] || 0) - (S.rev[b] || 0));
  h += `<div class="card"><h3>↻ À réviser</h3>`;
  if (!mems.length) h += `<div class="empty">Les sourates entièrement mémorisées apparaîtront ici, de la moins récemment révisée à la plus récente.</div>`;
  else h += mems.slice(0, 6).map(n => {
    const d = daysAgo(S.rev[n]);
    const lab = d === null ? "jamais révisée" : d === 0 ? "aujourd'hui" : "il y a " + d + " j";
    return `<div class="rv"><button class="ibtn" data-act="listenAll" data-s="${n}">${IC.play.replace("<svg", '<svg width="16" height="16"')}</button>
      <div class="sp" data-act="open" data-s="${n}"><div style="font-weight:600">${esc(BY[n].tr)}</div><div class="sm mut">${lab}</div></div>
      ${d === null || d >= 7 ? '<span class="tag">à revoir</span>' : ""}<button class="btn sm" data-act="revNow" data-s="${n}">✓</button></div>`;
  }).join("");
  h += `</div>`;
  // 14 jours
  const days = []; const d0 = new Date();
  for (let i = 13; i >= 0; i--) { const d = new Date(d0); d.setDate(d.getDate() - i); days.push([dkey(d), i === 0]); }
  const mx = Math.max(60, ...days.map(([k]) => S.log[k] || 0));
  h += `<div class="card"><h3>Régularité <span class="mut sm" style="font-weight:400;font-family:inherit">· 14 derniers jours</span></h3><div class="days">${days.map(([k, t]) => {

  return h;
}

  let h = `<div class="row" style="margin-top:14px"><h1 style="font-size:28px" class="sp">Sourates</h1>

  const opts = (sel, min) => range(min, N).map(i => `<option value="${i}" ${i === sel ? "selected" : ""}>${i}</option>`).join("");
  const loopLab = set.loop === 0 ? "∞" : set.loop + "×";
  let h = `<div class="top" id="top"><button class="back" data-act="back">‹</button><div class="sp" style="font-weight:600">${n}. ${esc(s.tr)}</div>
    <button class="chip ${set.test ? "on" : ""}" data-act="toggle" data-k="test">Mode test</button></div>
    <div class="shead"><div class="ar">${s.ar}</div><div class="mut sm">${esc(s.fr)} · ${N} versets · ${s.t === "meccan" ? "mecquoise" : "médinoise"}</div>
    <div class="bar" style="margin:10px auto 4px;max-width:260px"><i class="m" style="width:${c.m / N * 100}%"></i><i class="l" style="width:${c.l / N * 100}%"></i></div>
    <div class="legend" style="justify-content:center"><span><i style="background:var(--mem)"></i>${c.m} mémorisés</span><span><i style="background:var(--lrn)"></i>${c.l} en cours</span><span><i style="background:var(--new)"></i>${N - c.m - c.l} nouveaux</span></div></div>
    <div class="card"><div class="sel"><label>Du verset<select data-ch="from">${opts(from, 1)}</select></label><label>au verset<select data-ch="to">${opts(to, from)}</select></label></div>
    <div class="chips" style="margin-bottom:12px"><button class="chip" data-act="rng" data-v="next">Bloc suivant</button><button class="chip" data-act="rng" data-v="all">Toute la sourate</button><button class="chip" data-act="rng" data-v="wip">Versets en cours</button></div>
    <div class="row"><button class="btn pri sp" data-act="learn">🧠 Apprendre</button><button class="btn sp" data-act="listen">🎧 Écouter</button><button class="btn" data-act="loop" style="padding:0 12px">↻ ${loopLab}</button></div>
    <div class="plan">Méthode : ${from === to ? `<b>${from}</b>×${Math.max(1, set.rNew)}` : planText(set, from, to)}${set.gap ? ` · pause ${set.gap}× pour répéter` : ""} <a href="#" data-act="learnCfg" style="color:var(--g2);font-weight:600">modifier</a></div></div>
    <div class="row" style="justify-content:flex-end;gap:6px"><button class="chip ${set.showFr ? "on" : ""}" data-act="toggle" data-k="showFr">Traduction</button>
    <button class="chip ${set.showTl ? "on" : ""}" data-act="toggle" data-k="showTl">Phonétique</button><button class="chip" data-act="tlHelp" aria-label="Aide phonétique">?</button><button class="chip" data-act="fs" data-v="-2">A−</button><button class="chip" data-act="fs" data-v="2">A+</button></div>
    <div id="ays" class="${set.test ? "test" : ""}">${n !== 1 && n !== 9 ? `<div class="ar bism">${BISM}</div>` : ""}`;
  h += s.v.map((v, i) => {
    const a = i + 1, x = st(n, a);
    return `<div class="ay" id="ay-${a}" data-act="reveal"><div class="hd"><button class="med s${x}" data-act="cyc" data-a="${a}">${a}</button>
      <span class="stl">${["nouveau", "en cours", "mémorisé"][x]}</span><span class="sp"></span>
      <button class="ibtn" data-act="one" data-a="${a}" aria-label="Écouter">${IC.play.replace("<svg", '<svg width="16" height="16"')}</button></div>
      <div class="ar t">${v[0]}</div>${set.showTl ? `<div class="tl">${esc(v[2])}</div>` : ""}${set.showFr ? `<div class="fr">${esc(v[1])}</div>` : ""}</div>`;
  }).join("");
  h += `</div><div class="card"><div style="display:grid;gap:10px">
    <button class="btn full" data-act="revNow" data-s="${n}">✓ Marquer la sourate révisée aujourd'hui</button>
    <button class="btn full" data-act="dl" data-s="${n}" id="dlb">${S.off[curRec().id + "/" + n] ? "✓ Audio disponible hors-ligne" : "⬇︎ Télécharger l'audio (hors-ligne)"}</button>
    <div class="row"><button class="btn sp sm" data-act="markAll" data-v="2">Tout mémorisé</button><button class="btn sp sm" data-act="markAll" data-v="0">Tout réinitialiser</button></div>
    </div><p class="sm mut" style="margin:10px 2px 0">Touche le numéro d'un verset pour changer son statut : nouveau → en cours → mémorisé.${set.test ? " En mode test, touche un verset pour révéler son texte." : ""}</p></div>`;
  return h;
}

function stepper(k, min, max, lab, sub) {
  return `<div class="set"><div class="k">${lab}${sub ? `<small>${sub}</small>` : ""}</div><div class="stp"><button data-act="stp" data-k="${k}" data-v="-1" data-min="${min}" data-max="${max}">−</button><b>${S.settings[k]}</b><button data-act="stp" data-k="${k}" data-v="1" data-min="${min}" data-max="${max}">+</button></div></div>`;
}
function choice(k, vals, lab, sub) {
  return `<div class="set" style="flex-wrap:wrap"><div class="k" style="flex-basis:100%">${lab}${sub ? `<small>${sub}</small>` : ""}</div><div class="chips">${vals.map(([v, l]) => `<button class="chip ${S.settings[k] === v ? "on" : ""}" data-act="set" data-k="${k}" data-v="${v}">${l}</button>`).join("")}</div></div>`;
}
function sw(k, lab, sub) {
  return `<div class="set"><div class="k">${lab}${sub ? `<small>${sub}</small>` : ""}</div><button class="sw ${S.settings[k] ? "on" : ""}" data-act="toggle" data-k="${k}"></button></div>`;
}
function learnCfgHTML() {
  return stepper("rNew", 1, 10, "Nouveau verset", "Nombre d'écoutes du verset ajouté") +
    stepper("rChain", 0, 10, "Enchaînement", "Écoutes des versets enchaînés (0 = désactivé)") +
    choice("win", [[0, "Depuis le début"], [3, "3 derniers"], [5, "5 derniers"], [7, "7 derniers"]], "Enchaîner", "« 5 derniers » évite des enchaînements trop longs sur les grandes sourates") +
    choice("gap", [[0, "Aucune"], [0.5, "½×"], [1, "1×"], [1.5, "1,5×"], [2, "2×"]], "Pause pour répéter", "Silence après chaque écoute, proportionnel à la durée récitée") +
    stepper("rAll", 0, 10, "Tout ensemble à la fin", "0 = pas de récapitulatif") +
    choice("chunk", [[3, "3"], [5, "5"], [7, "7"], [10, "10"]], "Taille du « bloc suivant »", "Nombre de versets proposés par session") +
    `<div class="plan" style="margin-top:12px">Exemple sur 4 versets : ${planText(S.settings, 1, 4)}</div>`;
}

function vSettings() {
  const rec = S.settings.rec;
  return `<h1 style="font-size:28px;margin-top:14px">Réglages</h1>
  <div class="card"><h3>Récitateur</h3><select class="full" data-ch="rec">${RECITERS.map(r => `<option value="${r.id}" ${r.id === rec ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select>
  <div class="row" style="margin-top:10px"><button class="btn sm" data-act="testRec">▶︎ Tester (Al-Ikhlas)</button><span class="sm mut">Al-Husary Muʿallim est très lent, idéal pour débuter.</span></div>
  ${choice("speed", SPEEDS.map(v => [v, String(v).replace(".", ",") + "×"]), "Vitesse")}
  ${sw("bism", "Basmala avant la sourate", "En mode écoute, depuis le verset 1")}
  ${sw("wake", "Garder l'écran allumé", "Pendant une session")}</div>
  <div class="card"><h3>Méthode d'apprentissage</h3>${learnCfgHTML()}</div>
  <div class="card"><h3>Affichage</h3>${sw("showFr", "Traduction (Hamidullah)")}${sw("showTl", "Phonétique (lecture à la française)")}
  ${choice("order", [["desc", "An-Nas → An-Naba"], ["asc", "An-Naba → An-Nas"]], "Ordre des sourates")}</div>
  <div class="card"><h3>Hors-ligne</h3><p class="sm mut" style="margin:0 0 10px">Télécharge l'audio du récitateur choisi pour écouter sans réseau (métro, avion…). Environ 30 à 60 Mo pour tout Juz ʿAmma.</p>
  <button class="btn full" data-act="dlAll" id="dlAll">⬇︎ Télécharger tout Juz ʿAmma</button>
  <button class="btn full sm" style="margin-top:8px" data-act="clearAudio">Supprimer l'audio téléchargé</button></div>
  <div class="card"><h3>Sauvegarde</h3><p class="sm mut" style="margin:0 0 10px">Ta progression est enregistrée sur cet iPhone. Copie la sauvegarde de temps en temps (Notes, mail…).</p>
  <div class="row"><button class="btn sp" data-act="export">Copier ma sauvegarde</button><button class="btn sp" data-act="import">Importer</button></div>
  <button class="btn full sm" style="margin-top:8px;color:#b33" data-act="reset">Tout réinitialiser</button></div>
  <p class="sm mut" style="text-align:center;margin:18px 0">Texte : Tanzil / Noble Qur'an Encyclopedia · Audio : everyayah.com</p>`;
}

function renderPlayer() {
  const el = $("#player");
  if (!PL.on) { el.className = ""; el.innerHTML = ""; return; }
  const sr = BY[PL.s], stp = PL.steps[PL.si] || {}, paused = audio.paused;
  const total = PL.steps.length, inf = !isFinite(stp.reps);
  const ph = PL.phase === "gap" ? `<span class="ph gap">À TOI</span>` : PL.phase === "bism" ? `<span class="ph">BASMALA</span>` : `<span class="ph">ÉCOUTE</span>`;
  const sub = PL.phase === "gap" ? "Répète de mémoire…" : PL.phase === "bism" ? "" : "Verset " + PL.cur;
  const prog = PL.phase === "gap" ? 0 : ((PL.si + (stp.vs ? (PL.rep + PL.vi / stp.vs.length) / (inf ? 1 : stp.reps) : 0)) / total) * 100;
  el.className = "on";
  el.innerHTML = `<div class="pt">${ph}<span style="opacity:.85">${sub}</span><span class="sp"></span><span style="opacity:.75" data-act="open" data-s="${PL.s}">${esc(sr.tr)} ›</span></div>
    <div class="lbl">${PL.mode === "learn" ? `Étape ${PL.si + 1}/${total} · ` : ""}${esc(stp.label || "")}${stp.reps > 1 ? ` <span style="opacity:.7;font-weight:400">· ${PL.rep + 1}/${inf ? "∞" : stp.reps}</span>` : ""}</div>
    <div class="bar ${PL.phase === "gap" ? "g" : ""}"><i style="width:${prog}%"></i></div>
    <div class="ctl"><button data-act="stop" aria-label="Arrêter">${IC.stop}</button><button data-act="skip" data-v="-1" aria-label="Précédent">${IC.prev}</button>
    <button class="pp" data-act="pp" aria-label="Lecture">${paused ? IC.play : IC.pause}</button><button data-act="skip" data-v="1" aria-label="Suivant">${IC.next}</button>
    <button class="spd" data-act="speed">${String(S.settings.speed).replace(".", ",")}×</button></div>`;
}

function highlight(v, vs, noScroll) {
  document.querySelectorAll(".ay.play,.ay.inr").forEach(e => e.classList.remove("play", "inr"));
  if (!PL.on || view.name !== "surah" || view.s !== PL.s) return;
  (vs || []).forEach(a => { const e = document.getElementById("ay-" + a); e && e.classList.add("inr"); });
  if (v) { const e = document.getElementById("ay-" + v); if (e) { e.classList.add("play"); if (!noScroll) e.scrollIntoView({ behavior: "smooth", block: "center" }); } }
}

function openSheet(html) { const s = $("#sheet"); s.querySelector(".pn").innerHTML = `<div class="grab"></div>` + html; s.className = "on"; }
function closeSheet() { $("#sheet").className = ""; }
let toastT;
function toast(t) { const e = $("#toast"); e.textContent = t; e.className = "on"; clearTimeout(toastT); toastT = setTimeout(() => e.className = "", 3200); }

async function downloadSurah(n, btn) {
  const rec = curRec(), N = BY[n].v.length;
  const list = range(1, N).map(a => [n, a]);
  if (n !== 1 && S.settings.bism) list.unshift([1, 1]);
  let ok = 0;
  for (const [s, a] of list) {
    const k = rec.id + "/" + s + ":" + a;
    let have = null; try { have = await idb.get(k); } catch (e) {}
    if (!have) { const b = await fetchAudio(rec, s, a); if (!b) return false; try { await idb.put(k, b); } catch (e) { return false; } }
    ok++; if (btn) btn.textContent = `Téléchargement… ${Math.round(ok / list.length * 100)}%`;
  }
  S.off[rec.id + "/" + n] = true; save();
  return true;
}

/* ---------------- événements ---------------- */
const ACT = {
  tab: d => go(d.v),
  back: () => { if (history.state && history.length > 1) history.back(); else go("list"); },
  open: d => go("surah", { s: +d.s, from: d.f ? +d.f : 0, to: d.t ? +d.t : 0 }),
  filter: d => { view.f = d.v; try { history.replaceState(view, ""); } catch (e) {} render(); },
  order: () => { S.settings.order = S.settings.order === "desc" ? "asc" : "desc"; save(); render(); },
  cyc: (d, e) => { e.stopPropagation(); const a = +d.a, x = (st(view.s, a) + 1) % 3; setSt(view.s, a, x); const y = window.scrollY; render(); window.scrollTo(0, y); },
  reveal: (d, e, el) => { if (S.settings.test) el.classList.toggle("rev"); },
  one: (d, e) => { e.stopPropagation(); startSession("listen", view.s, +d.a, +d.a); },
  learn: () => startSession("learn", view.s, view.from, view.to),
  listen: () => startSession("listen", view.s, view.from, view.to),
  learnNow: d => { go("surah", { s: +d.s, from: +d.f, to: +d.t }); startSession("learn", +d.s, +d.f, +d.t); },
  listenAll: d => startSession("listen", +d.s, 1, BY[+d.s].v.length),
  loop: () => { const o = [1, 3, 5, 0]; S.settings.loop = o[(o.indexOf(S.settings.loop) + 1) % o.length]; save(); rerenderKeep(); },
  rng: d => {
    const n = view.s, N = BY[n].v.length;
    if (d.v === "all") { view.from = 1; view.to = N; }
    else if (d.v === "next") Object.assign(view, nextChunk(n));
    else { const w = range(1, N).filter(a => st(n, a) === 1); if (!w.length) return toast("Aucun verset « en cours » dans cette sourate"); view.from = w[0]; view.to = w[w.length - 1]; }
    rerenderKeep();
  },
  toggle: d => { S.settings[d.k] = !S.settings[d.k]; save(); rerenderKeep(); },
  fs: d => { S.settings.fs = Math.max(20, Math.min(44, S.settings.fs + +d.v)); save(); document.documentElement.style.setProperty("--fs", S.settings.fs + "px"); },
  learnCfg: (d, e) => { e.preventDefault(); openSheet(`<h2 style="font-size:22px;margin-bottom:6px">Méthode d'apprentissage</h2>${learnCfgHTML()}<button class="btn pri full" style="margin-top:14px" data-act="closeSheet">OK</button>`); },
  closeSheet: () => { closeSheet(); if (view.name === "surah") rerenderKeep(); },
  stp: d => { const k = d.k; S.settings[k] = Math.max(+d.min, Math.min(+d.max, S.settings[k] + +d.v)); save(); refreshCfg(); },
  set: d => { const k = d.k, cur = S.settings[k]; S.settings[k] = typeof cur === "number" ? +d.v : d.v; save(); if (k === "speed" && PL.on) audio.playbackRate = S.settings.speed; refreshCfg(); },
  speed: () => { const i = SPEEDS.indexOf(S.settings.speed); S.settings.speed = SPEEDS[(i + 1) % SPEEDS.length]; save(); if (PL.phase !== "gap") audio.playbackRate = S.settings.speed; renderPlayer(); },
  pp: () => togglePause(),
  tlHelp: () => openSheet(`<h2 style="font-size:22px">Lire la phonétique</h2>
    <div class="set"><div class="k"><b>ou</b><small>comme dans « loup » (le u arabe)</small></div></div>
    <div class="set"><div class="k"><b>â · î · oû</b><small>voyelle longue : on la tient deux temps</small></div></div>
    <div class="set"><div class="k"><b>'</b><small>petit coup de gorge (ʿayn ou hamza) : ʿamma, sa'ala</small></div></div>
    <div class="set"><div class="k"><b>kh</b><small>raclé, comme la jota espagnole</small></div></div>
    <div class="set"><div class="k"><b>gh</b><small>r grasseyé, au fond de la gorge</small></div></div>
    <div class="set"><div class="k"><b>q</b><small>k prononcé très au fond de la gorge</small></div></div>
    <div class="set"><div class="k"><b>th · dh</b><small>th anglais : « think » · « this »</small></div></div>
    <div class="set"><div class="k"><b>h · ch · dj</b><small>h toujours expiré · ch de « chat » · dj de « djinn »</small></div></div>
    <div class="set"><div class="k"><b>bb, ll, nn…</b><small>lettre doublée = on appuie dessus (shadda)</small></div></div>
    <div class="set"><div class="k"><b>n-nâs, l-qamar</b><small>le tiret marque l'article lié au mot précédent</small></div></div>
    <p class="sm mut" style="margin:12px 0 0">La phonétique suit la lecture enchaînée (liaisons) et l'arrêt en fin de verset. Elle aide à démarrer : l'écoute du récitateur reste la référence.</p>
    <button class="btn pri full" style="margin-top:14px" data-act="closeSheet">OK</button>`),
  skip: d => skip(+d.v),
  stop: () => stopSession(),
  markRange: d => { for (let a = +d.f; a <= +d.t; a++) setSt(+d.s, a, +d.v); closeSheet(); render(); toast(+d.v === 2 ? "Barakallāhu fīk ! Versets mémorisés ✅" : "Gardés en cours 🔁"); },
  again: d => { closeSheet(); startSession("learn", +d.s, +d.f, +d.t); },
  markAll: d => { if (!confirm(+d.v === 2 ? "Marquer toute la sourate comme mémorisée ?" : "Remettre tous les versets à « nouveau » ?")) return; range(1, BY[view.s].v.length).forEach(a => setSt(view.s, a, +d.v)); if (+d.v === 2 && !S.rev[view.s]) S.rev[view.s] = Date.now(); rerenderKeep(); },
  revNow: d => { S.rev[+d.s] = Date.now(); save(); toast("Révision notée ✓"); rerenderKeep(); },
  testRec: () => startSession("listen", 112, 1, 2),
  dl: async (d, e, el) => {
    if (el.dataset.busy) return; el.dataset.busy = 1;
    const ok = await downloadSurah(+d.s, el);
    delete el.dataset.busy;
    if (ok) { el.textContent = "✓ Audio disponible hors-ligne"; toast("Sourate disponible hors-ligne"); }
    else { el.textContent = "⬇︎ Télécharger l'audio (hors-ligne)"; toast("Téléchargement impossible avec ce récitateur — essaie Alafasy ou Al-Husary Murattal"); }
  },
  dlAll: async (d, e, el) => {
    if (el.dataset.busy) return; el.dataset.busy = 1;
    let i = 0;
    for (const n of order()) {
      el.textContent = `Téléchargement… sourate ${++i}/${DATA.length}`;
      if (!(await downloadSurah(n))) { delete el.dataset.busy; el.textContent = "⬇︎ Télécharger tout Juz ʿAmma"; return toast("Interrompu — ce récitateur ne permet peut-être pas le hors-ligne (essaie Alafasy)"); }
    }
    delete el.dataset.busy; el.textContent = "✓ Tout Juz ʿAmma est hors-ligne"; toast("Tout est téléchargé ✓");
  },
  clearAudio: async () => { if (!confirm("Supprimer tout l'audio téléchargé ?")) return; try { await idb.clear(); } catch (e) {} S.off = {}; mem.clear(); save(); toast("Audio supprimé"); },
  export: async () => {
    const txt = JSON.stringify(S);
    let ok = false; try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {}
    openSheet(`<h2 style="font-size:22px">Sauvegarde</h2><p class="sm mut">${ok ? "Copiée dans le presse-papiers ✓ Colle-la dans Notes pour la garder." : "Copie ce texte et garde-le dans Notes :"}</p><textarea readonly>${esc(txt)}</textarea><button class="btn pri full" style="margin-top:12px" data-act="closeSheet">OK</button>`);
  },
  import: () => openSheet(`<h2 style="font-size:22px">Importer une sauvegarde</h2><p class="sm mut">Colle ici le texte de ta sauvegarde. Elle remplacera la progression actuelle.</p><textarea id="imp" placeholder="{…}"></textarea><button class="btn pri full" style="margin-top:12px" data-act="doImport">Importer</button>`),
  doImport: () => {
    try { const o = JSON.parse($("#imp").value); if (!o || !o.settings || !o.st) throw 0; S = Object.assign(clone(DEF), o, { settings: Object.assign(clone(DEF.settings), o.settings) }); saveNow(); closeSheet(); render(); toast("Sauvegarde importée ✓"); }
    catch (e) { toast("Texte de sauvegarde invalide"); }
  },
  reset: () => { if (!confirm("Effacer toute ta progression ? C'est définitif.")) return; stopSession(); S = clone(DEF); saveNow(); go("home"); toast("Progression réinitialisée"); },
};
function rerenderKeep() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function refreshCfg() {
  const sh = $("#sheet");
  if (sh.className === "on" && sh.querySelector(".stp")) sh.querySelector(".pn").innerHTML = `<div class="grab"></div><h2 style="font-size:22px;margin-bottom:6px">Méthode d'apprentissage</h2>${learnCfgHTML()}<button class="btn pri full" style="margin-top:14px" data-act="closeSheet">OK</button>`;
  else rerenderKeep();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const f = ACT[el.dataset.act];
  if (f) f(el.dataset, e, el);
});
document.addEventListener("change", e => {
  const k = e.target.dataset.ch; if (!k) return;
  if (k === "from") { view.from = +e.target.value; if (view.to < view.from) view.to = view.from; rerenderKeep(); }
  else if (k === "to") { view.to = +e.target.value; rerenderKeep(); }
  else if (k === "rec") { S.settings.rec = e.target.value; save(); if (PL.on) stopSession(); toast("Récitateur : " + curRec().name); }
});
window.addEventListener("scroll", () => { const t = $("#top"); if (t) t.classList.toggle("sc", window.scrollY > 4); }, { passive: true });

try { history.replaceState(view, ""); } catch (e) {}
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
